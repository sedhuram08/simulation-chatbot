<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulation Knowledge Assistant</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'style.css' %}">
</head>
<body>

<div class="container">

    <h1>Simulation Knowledge Assistant</h1>

    <div class="card">

        <h2>Upload PDF</h2>

        <form method="POST" enctype="multipart/form-data">

            {% csrf_token %}

            <input type="file" name="pdf" accept=".pdf">

            <button type="submit">Upload</button>

        </form>

        {% if message %}
            <div class="success">
                {{ message }}
            </div>
        {% endif %}

    </div>

    <div class="card">

        <h2>Ask Question</h2>

        <form method="POST">

            {% csrf_token %}

            <input
                type="text"
                name="question"
                placeholder="Ask anything about simulations..."
                required>

            <button type="submit">Ask</button>

        </form>

    </div>

    {% if answer %}

    <div class="card">

        <h2>Answer</h2>

        <p>{{ answer }}</p>

    </div>

    {% endif %}

</div>

</body>
</html>
